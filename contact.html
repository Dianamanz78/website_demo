<!DOCTYPE html>
<html>
<style>
    .contact-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 500px;
        margin: 0 auto;
        padding: 24px;
        background-color: #E8DDBB;
        border-radius: 12px;
        color: #4A2545;
    }

    .contact-form label {
        font-weight: 500;
    }

    .contact-form input,
    .contact-form textarea {
        padding: 10px 12px;
        border: 2px solid #4A2545;
        border-radius: 8px;
        background-color: #FFFFFF66;
        color: #4A2545;
        font-family: inherit;
        font-size: 1rem;
        margin-bottom: 8px;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
        outline: none;
        border-color: #90AA86;
        box-shadow: 0 0 0 3px #90AA8666;
    }

    .send-button {
        align-self: flex-start;
        padding: 10px 24px;
        background-color: #90AA86;
        color: #4A2545;
        border: 2px solid #4A2545;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
    }

    .send-button:hover {
        background-color: #4A2545;
        color: #DCCCA3;
    }

    div.mycontainer {
        width: 100%;
        overflow: auto;
    }

    div.mycontainer div {
        width: 50%;
        float: left;
    }

    div.center_box {
        display: flex;
        justify-content: center;
    }
</style>
